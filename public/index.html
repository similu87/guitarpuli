<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="吉他普利 Guitarpuli：可移調、可夾 Capo 的吉他和弦譜。">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>吉他普利</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 64px icon rail (expands on hover) + content column; song page = framed tool panel, collapsible practice panel, two-column chord sheet */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --sunk:#E8EAE4; --ink:#1B2220; --muted:#5D6762; --line:#D8DCD5;
  --chord:#0D6A64; --brass:#9C6A12; --brass-soft:#F3E6CC; --on-brass:#FFFFFF; --panel:#E3E7E0; --panel-line:#C6CCC3;
  --g-pop:#2E7383; --g-folk:#52703C; --g-blues:#24476F; --g-rock:#97392C; --g-ballad:#715887; --g-oldies:#A6731A; --g-mine:#46504C;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sheet-size:16px; --rail:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111413; --surface:#191D1C; --sunk:#222827; --ink:#E3E7E3; --muted:#9AA39E; --line:#2C3331;
  --chord:#62C7BD; --brass:#D9A443; --brass-soft:#3A2F1A; --on-brass:#1A1406; --panel:#1F2524; --panel-line:#363F3C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --surface:#191D1C; --sunk:#222827; --ink:#E3E7E3; --muted:#9AA39E; --line:#2C3331;
  --chord:#62C7BD; --brass:#D9A443; --brass-soft:#3A2F1A; --on-brass:#1A1406; --panel:#1F2524; --panel-line:#363F3C; color-scheme:dark}
:root[data-skin="sepia"]{
  --bg:#EEE5D0; --surface:#F8F1E0; --sunk:#E4D8BD; --ink:#2B2116; --muted:#6C5C46; --line:#D4C5A6;
  --chord:#7C361A; --brass:#86560F; --brass-soft:#E9D6AE; --on-brass:#FFFFFF; --panel:#E3D5B5; --panel-line:#C8B48B; color-scheme:light}
:root[data-skin="amber"]{
  --bg:#0E0D0B; --surface:#171512; --sunk:#24201A; --ink:#EFE7D8; --muted:#A69C8A; --line:#2F2A22;
  --chord:#F2B84B; --brass:#E2865C; --brass-soft:#3A2418; --on-brass:#1A0E06; --panel:#1D1A15; --panel-line:#3B342A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit;text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* rail */
.rail{position:fixed;z-index:40;top:0;bottom:0;left:0;width:calc(var(--rail) + env(safe-area-inset-left,0px));padding:calc(14px + env(safe-area-inset-top,0px)) 8px 14px calc(8px + env(safe-area-inset-left,0px));
  background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;overflow:hidden;transition:width .18s ease,box-shadow .18s}
@media (hover:hover) and (min-width:721px){.rail:hover{width:272px;box-shadow:8px 0 24px rgba(0,0,0,.08)}}
.rail .rbtn{border:0;background:none;font:inherit;text-align:left;width:100%;cursor:pointer}
.rail a,.rail .rbtn{display:flex;align-items:center;gap:16px;min-height:46px;padding:0 13px;border-radius:8px;white-space:nowrap;color:var(--muted)}
.rail a:hover,.rail .rbtn:hover{background:var(--sunk);color:var(--ink)}
.rail a.on{background:var(--brass-soft);color:var(--brass)}
.rail .brand{color:var(--ink);margin-bottom:14px;min-height:58px}
.rail svg.i{width:22px;height:22px}
.rail .brand svg{stroke:var(--brass)}
.rail .lbl.brandtxt{display:grid;gap:3px;line-height:1.1}
.brandtxt b{font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:.02em}
.brandtxt b.en{font-size:21px;letter-spacing:.01em}
.brandtxt small{font-size:12px;letter-spacing:.24em;color:var(--muted);font-weight:700}
.rail .lbl{font-size:15.5px;opacity:0;transition:opacity .12s;display:flex;align-items:center;gap:8px}
.rail:hover .lbl{opacity:1}
.pro{font-size:9.5px;font-weight:700;letter-spacing:.12em;background:var(--brass);color:var(--on-brass);border-radius:4px;padding:1px 5px}
.rail .sep{margin-top:auto}
.rail .small{min-height:40px}
.rail .small .lbl{font-size:14px}
.rail .foot{font-size:11.5px;color:var(--muted);white-space:normal;padding:4px 10px 0;opacity:0;transition:opacity .15s;margin:0}
.rail:hover .foot{opacity:1}

main{margin-left:calc(var(--rail) + env(safe-area-inset-left,0px));padding:28px max(16px,env(safe-area-inset-right,0px)) 60px 32px;max-width:1720px}
@media (max-width:720px){
  .rail{top:auto;right:0;width:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line)}
  .rail .brand,.rail .lbl,.rail .foot{display:none}
  .rail .sep{margin-top:0}
  main{margin-left:0;padding:18px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
}

/* page heads */
.pagehead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:14px}
.pagehead h1{font-family:var(--f-disp);font-weight:900;font-size:24px;margin:0;letter-spacing:.02em}
.pagehead .count{color:var(--muted);font-size:13px}
.search{flex:1 1 260px;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px;height:38px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.filters select{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 8px;font-size:13px}
.seg-toggle{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:auto}
.seg-toggle button{border:0;background:var(--surface);height:30px;padding:0 10px;font-size:13px;color:var(--muted)}
.seg-toggle button.on{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:8px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--brass);font-weight:700}
.tabs a span{font-size:12px;color:var(--muted);margin-left:4px;font-weight:400}

/* grid cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.card{position:relative;min-width:0}
.card a{display:block}
.cover{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--c);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px}
.cover::after{content:"";position:absolute;inset:auto -20% -38% auto;width:85%;aspect-ratio:1;border-radius:50%;border:10px solid rgba(255,255,255,.12);box-shadow:0 0 0 14px rgba(255,255,255,.05)}
.cover .cv-g{font-size:11px;letter-spacing:.12em;opacity:.85}
.cover .cv-t{font-family:var(--f-disp);font-weight:900;font-size:20px;line-height:1.2;text-wrap:balance;position:relative;z-index:1}
.cover .cv-k{position:absolute;right:10px;top:8px;font-family:var(--f-mono);font-weight:700;font-size:13px;opacity:.9}
.card a:hover .cover{filter:brightness(1.08)}
.meta{padding-top:8px;display:grid;gap:1px}
.meta b{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.card:hover .fav,.fav.on,.fav:focus-visible{opacity:1}
.fav svg{width:16px;height:16px}
.fav.on svg{fill:currentColor}
.diff{display:inline-flex;gap:2px;vertical-align:middle}
.diff i{width:5px;height:9px;border-radius:1px;background:var(--line)}
.diff i.on{background:var(--brass)}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 56px 70px 70px 56px 44px;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:13.5px}
.lrow:first-child{border-top:0}
.lrow.h{font-size:11.5px;color:var(--muted);letter-spacing:.08em;background:var(--sunk)}
.lrow a.t{font-weight:700}
.lrow a.t:hover{color:var(--chord)}
.lrow .m{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .k{font-family:var(--f-mono);font-weight:700;color:var(--chord)}
.lrow .num{font-variant-numeric:tabular-nums;color:var(--muted)}
.lrow .fav{position:static;opacity:1;background:none;color:var(--muted);width:28px;height:28px}
.lrow .fav.on{color:var(--brass)}
.chip{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:6px;font-weight:400}
@media (max-width:720px){.lrow{grid-template-columns:minmax(0,1fr) 44px 40px}.lrow>:nth-child(2),.lrow>:nth-child(4),.lrow>:nth-child(5),.lrow>:nth-child(6){display:none}}

.empty{border:1px dashed var(--line);border-radius:8px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* song page */
.songhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.back{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);flex:none}
.songhead h1{font-family:var(--f-disp);font-weight:900;font-size:26px;line-height:1.25;margin:0;text-wrap:balance}
.songhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.songhead p .k{font-family:var(--f-mono);color:var(--chord);font-weight:700}
.songhead .grow{flex:1;min-width:0}
.hbtn{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;flex:none}
.hbtn.on{color:var(--brass);border-color:var(--brass)}
.hbtn.on svg{fill:currentColor}

.toolwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:1px;background:var(--panel-line);border:1.5px solid var(--panel-line);border-radius:12px;overflow:hidden;box-shadow:0 8px 20px -14px rgba(0,0,0,.35);min-width:0}
.tg{display:flex;flex-direction:column;gap:5px;padding:8px 14px 10px;background:var(--panel);flex:1 1 auto}
.tc{display:flex;align-items:center;gap:3px}
.tl{font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:700;white-space:nowrap}
.tb{min-width:30px;height:30px;border:0;border-radius:6px;background:var(--sunk);padding:0 8px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.tb:hover{background:var(--line)}
.tb.on{background:var(--brass);color:var(--on-brass)}
.tools .tb,.tools select{background:var(--surface)}
.tools .tb:hover{background:var(--sunk)}
.tools .tb.on{background:var(--brass)}
.tools select{height:30px;border:0;border-radius:6px;padding:0 6px}
.viewbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.viewbtns .tb{background:none;border:1px solid var(--line)}
.viewbtns .tb.on{background:var(--brass);border-color:var(--brass)}
.tv{font-family:var(--f-mono);font-weight:700;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;margin-left:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brass)}
.dots i.on:first-child{background:var(--chord)}

.note{font-size:12.5px;color:var(--muted);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:4px 16px}
.note b{color:var(--brass);font-weight:500}

/* wide-screen side columns */
.homecols{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
.aside{display:none}
@media (min-width:1400px){.homecols{grid-template-columns:minmax(0,1fr) 288px}.aside{display:grid;gap:16px;align-content:start;position:sticky;top:24px}}
.aside section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.aside h4{margin:0 0 10px;font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.cont{display:grid;gap:2px}
.cont a{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px;border-radius:8px;margin:0 -6px}
.cont a:hover{background:var(--sunk)}
.cont .sq{width:36px;height:36px;border-radius:6px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:12px}
.cont b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont .cp{font-size:11.5px;color:var(--brass);font-family:var(--f-mono);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:12.5px}
.chips button:hover{border-color:var(--muted)}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button span{color:var(--muted);margin-left:5px;font-size:11px}
.chips button.on span{color:inherit;opacity:.7}
.songbody{display:flex;flex-direction:column}
.songbody #practice{order:-1}
.songmain{min-width:0}
@media (min-width:1400px){.songbody.withside{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:36px;align-items:start}
  .songbody.withside #practice{order:2;position:sticky;top:130px}
  .songbody.withside .practice{grid-template-columns:minmax(0,1fr);margin:0}}

/* practice panel */
.practice{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 6px;margin-bottom:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 28px}
@media (max-width:720px){.practice{grid-template-columns:minmax(0,1fr)}}
.practice h4{margin:0 0 4px;font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.chordgrid{display:flex;flex-wrap:wrap;gap:2px 6px}
.cd{text-align:center;width:82px}
.cd b{font-family:var(--f-mono);color:var(--chord);font-size:14px}
.cd svg{display:block;margin:0 auto;color:var(--ink);width:78px;height:91px}
.cd small{display:grid;place-items:center;height:91px;color:var(--muted);font-size:11px}
.rhythm{display:grid;gap:10px;align-content:start;min-width:200px}
.rhythm .v{font-size:15px;font-weight:700}
.rhythm .v small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.snote{font-size:12.5px;color:var(--muted);margin-top:2px}
.strum{font-family:var(--f-mono);font-size:17px;letter-spacing:.08em;color:var(--chord)}

.sheet{font-size:var(--sheet-size);line-height:1.5}
@media (min-width:980px){.sheet.cols2{column-count:2;column-gap:56px;column-rule:1px solid var(--line)}}
.sec{break-inside:avoid;margin-bottom:1.4em}
.sec h3{font-size:.72em;letter-spacing:.14em;color:var(--brass);margin:0 0 .5em;font-weight:700;display:flex;align-items:center;gap:8px}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.ch{font-family:var(--f-mono);font-weight:700;color:var(--chord);cursor:help}
.ch:hover{text-decoration:underline;text-underline-offset:3px}
.row{margin-bottom:.55em}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-left:2px solid var(--muted)}
.bar{border-right:1px solid var(--muted);padding:.15em .6em;display:flex;gap:.8em;min-height:1.9em;align-items:center}
.bar:last-child{border-right-width:2px}
.lyr{padding:.1em .6em 0;color:var(--ink)}
.lyr.ph{color:var(--muted);opacity:.55;font-size:.85em}
.ln{display:flex;flex-wrap:wrap;align-items:flex-end;margin-bottom:.35em}
.seg{display:inline-flex;flex-direction:column}
.seg .c{min-height:1.35em;padding-right:.5em;font-family:var(--f-mono);font-weight:700;color:var(--chord);white-space:nowrap}
.seg .l{white-space:pre}

.lyrpanel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:18px;display:grid;gap:8px}
.lyrpanel p{margin:0;font-size:12.5px;color:var(--muted)}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 12px;font-size:14px;line-height:1.6;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:13px;display:inline-flex;align-items:center}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{color:var(--g-rock)}

/* editor */
.edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:900px){.edit{grid-template-columns:minmax(0,1fr)}}
.form{display:grid;gap:10px;align-content:start}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:520px){.form .three{grid-template-columns:1fr 1fr}}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.form input,.form select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;font-size:14px;min-width:0}
.form textarea{min-height:320px;font-family:var(--f-mono);font-size:13px}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0;overflow-x:auto}
.hint{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}
.hint code{font-family:var(--f-mono);color:var(--chord)}

/* prose pages */
.prose{max-width:720px}
.prose h1{font-family:var(--f-disp);font-weight:900;font-size:26px;margin:0 0 4px;text-wrap:balance}
.prose .en{color:var(--muted);font-size:13px;letter-spacing:.06em;margin:0 0 18px}
.prose h2{font-size:16px;margin:26px 0 6px}
.prose p,.prose li{font-size:14.5px;line-height:1.8}
.prose ol,.prose ul{padding-left:1.3em}
.draft{background:var(--brass-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13px}
.studio-hero{display:grid;gap:6px;margin-bottom:22px}
.studio-hero h1{display:flex;align-items:center;gap:10px}
.tabbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;overflow-x:auto;margin:10px 0 6px}
.tabbox pre{margin:0;font-family:var(--f-mono);font-size:14px;line-height:1.45;color:var(--ink)}
.tabbox pre em{font-style:normal;color:var(--chord);font-weight:700}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.feat div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.feat b{display:block;margin-bottom:2px}
.feat span{font-size:13px;color:var(--muted)}

/* theme menu + tooltip */
.themepop{position:fixed;z-index:50;left:calc(var(--rail) + 12px + env(safe-area-inset-left,0px));bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:grid;gap:2px;min-width:180px;box-shadow:0 14px 30px -10px rgba(0,0,0,.35)}
.themepop .h{font-size:11px;letter-spacing:.12em;color:var(--muted);padding:6px 10px 4px}
.themepop button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:6px;text-align:left;font-size:13.5px}
.themepop button:hover{background:var(--sunk)}
.themepop button.on{color:var(--brass);font-weight:700}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);flex:none}
@media (max-width:720px){.themepop{left:auto;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px))}}
.tip{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;box-shadow:0 10px 24px -8px rgba(0,0,0,.3);pointer-events:none;text-align:center}
.tip b{font-family:var(--f-mono);color:var(--chord);font-size:14px}
.tip svg{display:block;color:var(--ink)}
.tip small{display:block;color:var(--muted);font-size:11px;width:96px}

body.perform .rail,body.perform .songhead,body.perform .note,body.perform .practice{display:none}
body.perform main{margin-left:0;max-width:none;padding-left:max(24px,env(safe-area-inset-left,0px))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- music theory ---------- */
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const idx=n=>{const i=SH.indexOf(n);return i>=0?i:FL.indexOf(n)};
const mod=n=>((n%12)+12)%12;
function keyFlat(k){const m=k.match(/^([A-G][#b]?)(m?)$/);if(!m)return false;let i=idx(m[1]);if(m[2])i=mod(i+3);return [5,10,3,8,1].includes(i)}
function tNote(n,s,flat){const i=idx(n);return i<0?n:(flat?FL:SH)[mod(i+s)]}
function tKey(k,s){const m=k.match(/^([A-G][#b]?)(m?)$/);const minor=!!m[2];const i=mod(idx(m[1])+s);const rel=minor?mod(i+3):i;return ([5,10,3,8,1].includes(rel)?FL:SH)[i]+(minor?'m':'')}
function tChord(c,s,flat){const m=c.match(/^([A-G][#b]?)([^/]*)(?:\/([A-G][#b]?))?$/);if(!m)return c;return tNote(m[1],s,flat)+m[2]+(m[3]?'/'+tNote(m[3],s,flat):'')}
const MAJ={I:0,II:2,III:4,IV:5,V:7,VI:9,VII:11},MIN={I:0,II:2,III:3,IV:5,V:7,VI:8,VII:10};
function deg(tok,key){const m=tok.match(/^(b?)(VII|VI|V|IV|III|II|I|vii|vi|v|iv|iii|ii|i)(.*)$/);if(!m)return tok;
  const minorKey=key.endsWith('m'),root=key.replace(/m$/,'');const semi=(minorKey?MIN:MAJ)[m[2].toUpperCase()]-(m[1]?1:0);
  return tNote(root,semi,keyFlat(key))+(m[2]===m[2].toLowerCase()?'m':'')+m[3]}

function shapeOf(c){c=c.split('/')[0];if(SHAPES[c])return SHAPES[c];const m=c.match(/^([A-G][#b]?)(.*)$/);if(m&&ENH[m[1]]&&SHAPES[ENH[m[1]]+m[2]])return SHAPES[ENH[m[1]]+m[2]];return null}
function diagram(sh){const f=[...sh].map(x=>x==='x'?-1:+x);const pos=f.filter(n=>n>0);const max=Math.max(0,...pos);const base=max>4?Math.min(...pos):1;

function chordsOf(song){const out=[];const add=c=>{if(c&&/^[A-G]/.test(c)&&!out.includes(c))out.push(c)};
  if(song.sections)song.sections.forEach(s=>s.rows.forEach(r=>r.forEach(b=>b.forEach(add))));
  else parsePro(song.body).forEach(s=>s.lines.forEach(l=>l.forEach(g=>add(g.c))));return out}
function capoScore(song,shift,capo){const shape=tKey(tKey(song.key,shift),-capo),flat=keyFlat(shape);let sc=0;
  chordsOf(song).forEach(c=>{const x=tChord(c,shift-capo,flat).split('/')[0];sc+=OPEN.has(x)?2:['F','Bm','F#m','Bb'].includes(x)?.6:0});return sc-capo*.15}
function bestCapo(song,shift){let best=0,bs=-1e9;for(let c=0;c<=7;c++){const v=capoScore(song,shift,c);if(v>bs+1e-9){bs=v;best=c}}return best}

function drawSheet(){

    <div class="rhythm"><div><h4>${t('feel')}</h4><div class="v">${t('feels')[s.feel]||t('feels').straight8}<small>${s.time||'4/4'}</small></div></div>${s.strum?`<div><h4>${t('strum')}</h4><div class="strum">${esc(s.strum)}</div>${strumNote?`<div class="snote">${strumNote}</div>`:''}</div>`:''}</div></div>`:'';

      :`<div class="ln"><span class="l">${esc(segs.map(g=>g.l).join(''))}</span></div>`).join('')}</section>`).join('');

function drawLyrPanel(){
  const p=$('#lyrpanel');if(!st.lyrOpen){p.innerHTML='';drawSheet();return}
  const rows=st.song.sections.reduce((n,s)=>n+s.rows.length,0);

  $('#lyrclose').onclick=()=>act('lyr');
  drawSheet();

function parsePro(txt){const secs=[];let cur={name:'',lines:[]};const push=()=>{if(cur.lines.length||cur.name)secs.push(cur)};
  String(txt||'').split(/\r?\n/).forEach(raw=>{const line=raw.replace(/\s+$/,'');
    const d=line.match(/^\{(?:c|comment)\s*:\s*(.*)\}$/i)||line.match(/^#\s*(.+)$/);
    if(d){push();cur={name:d[1].trim(),lines:[]};return}
    if(/^\{\w+\s*:.*\}$/.test(line))return;
    if(!line.trim()){if(cur.lines.length){push();cur={name:'',lines:[]}}return}
    const segs=[];const re=/\[([^\]]+)\]/g;let last=0,m,pend=null;
    while((m=re.exec(line))){const x=line.slice(last,m.index);if(pend!==null||x)segs.push({c:pend,l:x});pend=m[1];last=re.lastIndex}
    segs.push({c:pend,l:line.slice(last)});cur.lines.push(segs)});
  push();return secs}

/* metronome */
let actx,mT,beat=0;
function metroStart(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){return}
  st.metro=true;beat=0;$('#metrobtn').classList.add('on');$('#metrobtn').textContent='❚❚';click();mT=setInterval(click,60000/st.bpm)}
function metroStop(){st.metro=false;clearInterval(mT);const b=$('#metrobtn');if(b){b.classList.remove('on');b.textContent='▶'}document.querySelectorAll('#dots i').forEach(d=>d.classList.remove('on'))}
function blip(tm,freq,vol){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(vol,tm);g.gain.exponentialRampToValueAtTime(.001,tm+.045);o.connect(g).connect(actx.destination);o.start(tm);o.stop(tm+.05)}
function click(){const tm=actx.currentTime+.01,dur=60/st.bpm;blip(tm,beat%4===0?1600:1000,.35);
  if(st.sub&&st.song)(SUB[st.song.feel]||SUB.straight8).forEach(fr=>blip(tm+fr*dur,2200,.08));
  document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i===beat%4));beat++}
function setPerform(on){document.body.classList.toggle('perform',on);const b=$('#perfbtn');if(b){b.classList.toggle('on',on);b.textContent=on?t('endPerform'):t('perform')}}
function stopAll(){if(st.metro)metroStop();setPerform(false)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')setPerform(false)});

/* ---------- editor ---------- */
function viewEdit(id){
  stopAll();const s=mine().find(x=>x.id===id)||{id:'',title:'',artist:'',key:'G',bpm:90,capo:0,feel:'straight8',time:'4/4',strum:'',body:t('sample')};
  const keys=['C','C#','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B','Am','Bbm','Bm','Cm','C#m','Dm','Ebm','Em','Fm','F#m','Gm','G#m'];
  $('#app').innerHTML=`<header class="pagehead"><h1>${s.id?t('editTitle'):t('newTitle')}</h1></header>
  <div class="edit"><div class="form">
    <div class="two"><label>${t('fTitle')}<input id="ed-title" value="${esc(s.title)}"></label><label>${t('fArtist')}<input id="ed-artist" value="${esc(s.artist)}"></label></div>
    <div class="three"><label>${t('fKey')}<select id="ed-key">${keys.map(k=>`<option ${k===s.key?'selected':''}>${k}</option>`).join('')}</select></label>
      <label>${t('fCapo')}<select id="ed-capo">${[...Array(8)].map((_,i)=>`<option value="${i}" ${i==s.capo?'selected':''}>${i||t('capoNo')}</option>`).join('')}</select></label>
      <label>BPM<input id="ed-bpm" type="number" min="40" max="240" value="${s.bpm}"></label></div>
    <div class="three"><label>${t('fFeel')}<select id="ed-feel">${Object.keys(SUB).map(k=>`<option value="${k}" ${k===s.feel?'selected':''}>${t('feels')[k]}</option>`).join('')}</select></label>
      <label>${t('fTime')}<select id="ed-time">${['4/4','3/4','6/8','12/8','2/4'].map(x=>`<option ${x===s.time?'selected':''}>${x}</option>`).join('')}</select></label>
      <label>${t('fStrum')}<input id="ed-strum" value="${esc(s.strum)}" placeholder="↓ ↓↑ ↑↓↑"></label></div>
    <div class="hint" id="capohint"></div>
    <label>${t('fBody')}<textarea id="ed-body" spellcheck="false">${esc(s.body)}</textarea></label>
    <div class="hint">${t('hint')}</div>
    <div class="btns"><button class="btn pri" id="ed-save">${t('btnSave')}</button><a class="btn" href="${s.id?'#my-'+s.id:'#library-mine'}">${t('btnCancel')}</a>${s.id?`<button class="btn warn" id="ed-del">${t('btnDel')}</button>`:''}</div>
  </div><div class="preview"><div class="sheet" id="pv"></div></div></div>`;
  const pv=()=>{const key=$('#ed-key').value,capo=+$('#ed-capo').value,body=$('#ed-body').value;const shape=tKey(key,-capo),flat=keyFlat(shape);
    const best=bestCapo({key,body},0);
    $('#capohint').innerHTML=t('capoHint')(capo,shape,t('bestLabel')(best,tKey(key,-best)));
    $('#pv').innerHTML=parsePro(body).map(x=>`<section class="sec">${x.name?`<h3>${esc(x.name)}</h3>`:''}${x.lines.map(segs=>`<div class="ln">${segs.map(g=>`<span class="seg"><span class="c">${g.c?esc(tChord(g.c,-capo,flat)):''}</span><span class="l">${esc(g.l)||' '}</span></span>`).join('')}</div>`).join('')}</section>`).join('')};
  ['#ed-body','#ed-key','#ed-capo'].forEach(x=>$(x).addEventListener('input',pv));pv();
  $('#ed-save').onclick=()=>{const ti=$('#ed-title').value.trim();if(!ti){$('#ed-title').focus();$('#ed-title').placeholder=t('needTitle');return}
    const rec={id:s.id||'u'+Date.now(),title:ti,artist:$('#ed-artist').value.trim(),key:$('#ed-key').value,capo:+$('#ed-capo').value,bpm:+$('#ed-bpm').value||90,
      feel:$('#ed-feel').value,time:$('#ed-time').value,strum:$('#ed-strum').value.trim(),body:$('#ed-body').value};
    const l=mine().filter(x=>x.id!==rec.id);l.unshift(rec);LS.set('mine',l);LS.set('pref_'+rec.id,null);location.hash='my-'+rec.id};
  if($('#ed-del')){let armed=false;$('#ed-del').onclick=()=>{if(!armed){armed=true;$('#ed-del').textContent=t('delConfirm');return}LS.set('mine',mine().filter(x=>x.id!==s.id));location.hash='library-mine'}}
}

/* ---------- tooltip ---------- */
document.addEventListener('mouseover',e=>{const c=e.target.closest('.ch');const tip=$('#tip');if(!c){tip.hidden=true;return}
  const name=c.textContent;const sh=shapeOf(name);tip.innerHTML=`<b>${esc(name)}</b>${sh?diagram(sh):`<small>${t('noDiagramTip')}</small>`}`;tip.hidden=false;
  const r=c.getBoundingClientRect();const w=tip.offsetWidth,h=tip.offsetHeight;let x=r.left+r.width/2-w/2,y=r.top-h-8;if(y<8)y=r.bottom+8;x=Math.max(8,Math.min(innerWidth-w-8,x));tip.style.left=x+'px';tip.style.top=y+'px'});
window.addEventListener('scroll',()=>{$('#tip').hidden=true},{passive:true});

/* ---------- router ---------- */
function route(keep){
  let h=location.hash.slice(1)||'home';
  h={favorites:'library-saved',mine:'library-mine',recent:'library-recent'}[h]||h;
  let nav='home';
  if(h.startsWith('song-')){const s=SONGS.find(x=>x.id===h.slice(5));s?openSong(s,false,keep===true):viewHome()}
  else if(h.startsWith('my-')){const s=mine().find(x=>x.id===h.slice(3));s?openSong(s,true,keep===true):viewLibrary('library-mine');nav='library'}
  else{stopAll();
    if(h.startsWith('edit-')){viewEdit(h.slice(5));nav='library'}
    else if(h==='new'){viewEdit('');nav='library'}
    else if(h.startsWith('library')){viewLibrary(['library','library-saved','library-mine','library-recent'].includes(h)?h:'library');nav='library'}
    else if(h==='studio'){viewStudio();nav='studio'}
    else if(h==='legal'){viewLegal();nav='legal'}
    else viewHome()}
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
  if(keep!==true)window.scrollTo(0,0);$('#tip').hidden=true;
}
document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
applyTheme(curTheme);renderRail();
window.addEventListener('hashchange',()=>route());
$('#app').innerHTML='<p style="color:var(--muted)">…</p>';
fetch('songs.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{SONGS=d;route()}).catch(()=>{$('#app').innerHTML='<div class="empty"><b>'+(lang==='zh'?'樂譜載入失敗':'Could not load sheets')+'</b>'+(lang==='zh'?'請重新整理頁面。':'Please reload the page.')+'</div>'});
