<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="吉他普利 Guitarpuli：可移調、可夾 Capo 的吉他和弦譜。">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>吉他普利</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 64px icon rail (expands on hover) + content column; song page = framed tool panel, collapsible practice panel, two-column chord sheet */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --sunk:#E8EAE4; --ink:#1B2220; --muted:#5D6762; --line:#D8DCD5;
  --chord:#0D6A64; --brass:#9C6A12; --brass-soft:#F3E6CC; --on-brass:#FFFFFF; --panel:#E3E7E0; --panel-line:#C6CCC3;
  --g-ballad:#715887; --g-upbeat:#2E7383; --g-folk:#52703C; --g-rock:#97392C; --g-jazz:#A6731A; --g-blues:#24476F; --g-rnb:#8C4466; --g-rap:#5E6A1F; --g-ost:#2F6B60; --g-mine:#46504C;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sheet-size:16px; --rail:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111413; --surface:#191D1C; --sunk:#222827; --ink:#E3E7E3; --muted:#9AA39E; --line:#2C3331;
  --chord:#62C7BD; --brass:#D9A443; --brass-soft:#3A2F1A; --on-brass:#1A1406; --panel:#1F2524; --panel-line:#363F3C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --surface:#191D1C; --sunk:#222827; --ink:#E3E7E3; --muted:#9AA39E; --line:#2C3331;
  --chord:#62C7BD; --brass:#D9A443; --brass-soft:#3A2F1A; --on-brass:#1A1406; --panel:#1F2524; --panel-line:#363F3C; color-scheme:dark}
:root[data-skin="sepia"]{
  --bg:#EEE5D0; --surface:#F8F1E0; --sunk:#E4D8BD; --ink:#2B2116; --muted:#6C5C46; --line:#D4C5A6;
  --chord:#7C361A; --brass:#86560F; --brass-soft:#E9D6AE; --on-brass:#FFFFFF; --panel:#E3D5B5; --panel-line:#C8B48B; color-scheme:light}
:root[data-skin="amber"]{
  --bg:#0E0D0B; --surface:#171512; --sunk:#24201A; --ink:#EFE7D8; --muted:#A69C8A; --line:#2F2A22;
  --chord:#F2B84B; --brass:#E2865C; --brass-soft:#3A2418; --on-brass:#1A0E06; --panel:#1D1A15; --panel-line:#3B342A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit;text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* rail */
.rail{position:fixed;z-index:40;top:0;bottom:0;left:0;width:calc(var(--rail) + env(safe-area-inset-left,0px));padding:calc(14px + env(safe-area-inset-top,0px)) 8px 14px calc(8px + env(safe-area-inset-left,0px));
  background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;overflow:hidden;transition:width .18s ease,box-shadow .18s}
@media (hover:hover) and (min-width:721px){.rail:hover{width:272px;box-shadow:8px 0 24px rgba(0,0,0,.08)}}
.rail .rbtn{border:0;background:none;font:inherit;text-align:left;width:100%;cursor:pointer}
.rail a,.rail .rbtn{display:flex;align-items:center;gap:16px;min-height:46px;padding:0 13px;border-radius:8px;white-space:nowrap;color:var(--muted)}
.rail a:hover,.rail .rbtn:hover{background:var(--sunk);color:var(--ink)}
.rail a.on{background:var(--brass-soft);color:var(--brass)}
.rail .brand{color:var(--ink);margin-bottom:14px;min-height:58px}
.rail svg.i{width:22px;height:22px}
.rail .brand svg{stroke:var(--brass)}
.rail .lbl.brandtxt{display:grid;gap:3px;line-height:1.1}
.brandtxt b{font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:.02em}
.brandtxt b.en{font-size:21px;letter-spacing:.01em}
.brandtxt small{font-size:12px;letter-spacing:.24em;color:var(--muted);font-weight:700}
.rail .lbl{font-size:15.5px;opacity:0;transition:opacity .12s;display:flex;align-items:center;gap:8px}
.rail:hover .lbl{opacity:1}
.pro{font-size:9.5px;font-weight:700;letter-spacing:.12em;background:var(--brass);color:var(--on-brass);border-radius:4px;padding:1px 5px}
.rail .sep{margin-top:auto}
.rail .small{min-height:40px}
.rail .small .lbl{font-size:14px}
.rail .foot{font-size:11.5px;color:var(--muted);white-space:normal;padding:4px 10px 0;opacity:0;transition:opacity .15s;margin:0}
.rail:hover .foot{opacity:1}

main{margin-left:calc(var(--rail) + env(safe-area-inset-left,0px));padding:28px max(16px,env(safe-area-inset-right,0px)) 60px 32px;max-width:1720px}
@media (max-width:720px){
  .rail{top:auto;right:0;width:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line)}
  .rail .brand,.rail .lbl,.rail .foot{display:none}
  .rail .sep{margin-top:0}
  main{margin-left:0;padding:18px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
}

/* page heads */
.pagehead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:14px}
.pagehead h1{font-family:var(--f-disp);font-weight:900;font-size:24px;margin:0;letter-spacing:.02em}
.pagehead .count{color:var(--muted);font-size:13px}
.search{flex:1 1 260px;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px;height:38px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.filters select{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 8px;font-size:13px}
.filters #f-sort{margin-left:auto}.filters .seg-toggle{margin-left:0}
/* 篩選：4A-4 和弦卡風（方格標籤＋勾選） */
.fbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.fbtn svg.i{width:15px;height:15px}
.fbtn .n{font-family:var(--f-mono);font-size:12px}
.fbtn.act,.fbtn[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 6px 0 12px;border-radius:999px;border:0;background:var(--brass-soft);font-size:13px}
.pill b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-weight:500;color:var(--brass)}
.pill:hover b{background:var(--surface)}
.flink{border:0;background:none;padding:4px 2px;color:var(--brass);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.fwrap{margin:-6px 0 20px}
.fscrim,.fgrab,.fhead{display:none}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.fbody{display:flex;flex-direction:column;gap:16px}
.fgrp h3{margin:0 0 8px;font-size:12.5px;letter-spacing:.12em;color:var(--muted);font-weight:700;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fgrp h3 small{letter-spacing:0;font-weight:400;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{position:relative;min-height:62px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:8px 30px 8px 14px;text-align:left;box-shadow:inset 3px 0 0 var(--c)}
.tile b{font-size:15px;display:flex;align-items:baseline;gap:6px}
.tile b span{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted)}
.tile small{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.tile:hover{border-color:var(--muted)}
.tile.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.on small,.tile.on b span{color:inherit;opacity:.72}
.tile .ck{position:absolute;right:9px;top:9px;width:18px;height:18px;border-radius:50%;background:var(--brass);display:grid;place-items:center}
.tile .ck svg{width:11px;height:11px;fill:none;stroke:var(--on-brass);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.tile.off,.fk.off{opacity:.42}
.frow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.6fr);gap:24px}
.segs{display:flex;flex-wrap:wrap;gap:8px}
.fk{height:40px;min-width:56px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.fk span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.fk:hover{border-color:var(--muted)}
.keys .fk{font-family:var(--f-mono);font-weight:700;color:var(--chord);min-width:48px}
.fk.on,.keys .fk.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.fk.on span{color:inherit;opacity:.7}
.ffoot{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.ffoot .flink{margin-right:auto}
.fshow{height:40px;padding:0 22px;border-radius:10px;border:0;background:var(--brass);color:var(--on-brass);font-size:14.5px;font-weight:700}
@media (max-width:980px){.frow{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){
  .fwrap{position:fixed;inset:0;z-index:60;margin:0}
  .fscrim{display:block;position:absolute;inset:0;background:rgba(0,0,0,.38)}
  .fpanel{position:absolute;left:0;right:0;bottom:0;max-height:86vh;border-radius:18px 18px 0 0;padding:10px 16px 0;gap:12px;border:0}
  .fgrab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
  .fhead{display:flex;align-items:center}.fhead h2{margin:0;font-size:18px}.fhead .flink{margin-left:auto;font-size:14px}
  .fbody{overflow:auto;flex:1;min-height:0;padding-bottom:4px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ffoot{padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
  .ffoot .flink{display:none}
  .fshow{width:100%;height:48px;font-size:16px;border-radius:12px}
  body.fsheet{overflow:hidden}
}
.seg-toggle{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:auto}
.seg-toggle button{border:0;background:var(--surface);height:30px;padding:0 10px;font-size:13px;color:var(--muted)}
.seg-toggle button.on{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:8px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--brass);font-weight:700}
.tabs button{padding:8px 14px;font-size:14px;color:var(--muted);border:0;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;background:none}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brass);font-weight:700}
.tabs button span{font-size:12px;color:var(--muted);margin-left:4px;font-weight:400}
.tabs a span{font-size:12px;color:var(--muted);margin-left:4px;font-weight:400}

/* grid cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.card{position:relative;min-width:0}
.card a{display:block}
.cover{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--c);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px}
.cover::after{content:"";position:absolute;inset:auto -20% -38% auto;width:85%;aspect-ratio:1;border-radius:50%;border:10px solid rgba(255,255,255,.12);box-shadow:0 0 0 14px rgba(255,255,255,.05)}
.cover .cv-g{font-size:11px;letter-spacing:.12em;opacity:.85}
.cover .cv-t{font-family:var(--f-disp);font-weight:900;font-size:20px;line-height:1.2;text-wrap:balance;position:relative;z-index:1}
.cover .cv-k{position:absolute;right:10px;top:8px;font-family:var(--f-mono);font-weight:700;font-size:13px;opacity:.9}
.card a:hover .cover{filter:brightness(1.08)}
.meta{padding-top:8px;display:grid;gap:1px}
.meta b{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.card:hover .fav,.fav.on,.fav:focus-visible{opacity:1}
.fav svg{width:16px;height:16px}
.fav.on svg{fill:currentColor}
.diff{display:inline-flex;gap:2px;vertical-align:middle}
.diff i{width:5px;height:9px;border-radius:1px;background:var(--line)}
.diff i.on{background:var(--brass)}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 56px 70px 70px 56px 44px;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:13.5px}
.lrow:first-child{border-top:0}
.lrow.h{font-size:11.5px;color:var(--muted);letter-spacing:.08em;background:var(--sunk)}
.lrow a.t{font-weight:700}
.lrow a.t:hover{color:var(--chord)}
.lrow .m{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .k{font-family:var(--f-mono);font-weight:700;color:var(--chord)}
.lrow .num{font-variant-numeric:tabular-nums;color:var(--muted)}
.lrow .fav{position:static;opacity:1;background:none;color:var(--muted);width:28px;height:28px}
.lrow .fav.on{color:var(--brass)}
.chip{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:6px;font-weight:400}
@media (max-width:720px){.lrow{grid-template-columns:minmax(0,1fr) 44px 40px}.lrow>:nth-child(2),.lrow>:nth-child(4),.lrow>:nth-child(5),.lrow>:nth-child(6){display:none}}

.empty{border:1px dashed var(--line);border-radius:8px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* song page */
.songhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.back{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);flex:none}
.songhead h1{font-family:var(--f-disp);font-weight:900;font-size:26px;line-height:1.25;margin:0;text-wrap:balance}
.songhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.songhead p .k{font:inherit;color:inherit}
.songhead .grow{flex:1;min-width:0}
.hbtn{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;flex:none}
.hbtn.on{color:var(--brass);border-color:var(--brass)}
.hbtn.on svg{fill:currentColor}

.toolwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:1px;background:var(--panel-line);border:1.5px solid var(--panel-line);border-radius:12px;overflow:hidden;box-shadow:0 8px 20px -14px rgba(0,0,0,.35);min-width:0}
.tg{display:flex;flex-direction:column;gap:5px;padding:8px 14px 10px;background:var(--panel);flex:1 1 auto}
.tc{display:flex;align-items:center;gap:3px}
.tl{font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:700;white-space:nowrap}
.tb{min-width:30px;height:30px;border:0;border-radius:6px;background:var(--sunk);padding:0 8px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.tb:disabled{opacity:.4;cursor:default}
.tb:hover{background:var(--line)}
.tb.on{background:var(--brass);color:var(--on-brass)}
.tools .tb,.tools select{background:var(--surface)}
.tools .tb:hover{background:var(--sunk)}
.tools .tb.on{background:var(--brass)}
.tools select{height:30px;border:0;border-radius:6px;padding:0 6px}
.viewbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.viewbtns .tb{background:none;border:1px solid var(--line)}
.viewbtns .tb.on{background:var(--brass);border-color:var(--brass)}
.tv{font-family:var(--f-mono);font-weight:700;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;margin-left:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brass)}
.dots i.on:first-child{background:var(--chord)}

.note{font-size:12.5px;color:var(--muted);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:4px 16px}
.note b{color:var(--brass);font-weight:500}

/* wide-screen side columns */
.homecols{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
.aside{display:grid;gap:16px;align-content:start;min-width:0}
.aside-more{display:none}
@media (min-width:900px){.homecols{grid-template-columns:minmax(0,1fr) 260px}.aside{position:sticky;top:24px}}
.hotc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.hotc .hh{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.hotc h4{margin:0 auto 0 0;font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.hseg{display:flex;gap:2px}
.hseg button{border:0;background:none;color:var(--muted);font-size:12px;padding:3px 8px;border-radius:6px;cursor:pointer}
.hseg button.on{background:var(--sunk);color:var(--ink)}
.hotlist{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.hotlist a,.hotlist button{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:8px;row-gap:3px;align-items:baseline;padding:6px;margin:0 -6px;border-radius:6px;font-size:13.5px;width:calc(100% + 12px);text-align:left;border:0;background:none;color:inherit;cursor:pointer}
.hotlist a:hover,.hotlist button:hover{background:var(--sunk)}
.hotlist i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--brass);font-weight:700}
.hotlist .t{display:flex;gap:6px;align-items:baseline;min-width:0}
.hotlist b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hotlist small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hotlist .hb{grid-column:2;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.hotlist .hb span{display:block;height:100%;background:var(--chord);border-radius:2px}
.hotc .none{margin:0;font-size:13px;color:var(--muted)}
.statline{margin:0;padding:0 4px;color:var(--muted);font-size:12px;line-height:1.9}

.themepop button.on{color:var(--brass);font-weight:700}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);flex:none}
@media (max-width:720px){.themepop{left:auto;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px))}}
.tip{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;box-shadow:0 10px 24px -8px rgba(0,0,0,.3);pointer-events:none;text-align:center}
.tip b{font-family:var(--f-mono);color:var(--chord);font-size:14px}
.tip svg{display:block;color:var(--ink)}
.tip small{display:block;color:var(--muted);font-size:11px;width:96px}

body.perform .rail,body.perform .songhead,body.perform .note,body.perform .practice,body.perform .sitefoot,body.perform .toolwrap,body.perform #lyrpanel,body.perform .lyrwarn{display:none}
body.perform .orderbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px;padding-right:52px;border-bottom:1px solid var(--line)}
body.perform .sheet{font-size:calc(var(--sheet-size) * 1.4)}
body.perform .exitperf{display:inline-flex;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:30;background:var(--surface)}
/* social, footer, modal, report */
.rail .ig svg{color:#E1306C}
.rail .yt svg{color:#FF0033}
.rail .divider{height:1px;background:var(--line);margin:6px 10px;flex:none}
.rail .avatar{width:22px;height:22px;border-radius:50%;background:var(--brass);color:var(--on-brass);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.rail .sync{font-size:11.5px;color:var(--muted);margin-left:2px}
.rail .bottom{min-height:38px}
@media (max-width:720px){.rail .m-hide{display:none}.rail .bottom{min-height:46px}}
.sitefoot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;color:var(--muted);font-size:13px}
.sitefoot .follow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sitefoot .follow b{color:var(--ink);font-size:13.5px;margin-right:4px}
.sbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px 0 12px;border-radius:999px;color:#fff;font-weight:700;font-size:13.5px}
.sbtn svg.i{width:19px;height:19px}
.sbtn.ig{background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF)}
.sbtn.yt{background:#E00000}
.sbtn:hover{filter:brightness(1.08)}
.sitefoot .links{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
.sitefoot .ver{font-variant-numeric:tabular-nums;text-decoration:underline;text-underline-offset:3px}
.clog .lead{margin:0 0 26px;color:var(--muted);font-size:13px}
.clog .ver{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px}
.clog .vv{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--brass)}
.clog .ver time{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.clog .line{border-left:2px solid var(--line);padding:0 0 26px 22px;position:relative;min-width:0}
.clog .ver:last-child .line{border-left-color:transparent}
.clog .line::before{content:"";position:absolute;left:-8px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--brass)}
.clog h3{margin:0 0 6px;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.clog ul{margin:0 0 12px;padding-left:1.1em}
.clog .songs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.clog .songs a{padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--chord);font-size:13px}
.clog .songs a:hover{border-color:var(--chord)}
.clog .songs small{color:var(--muted);margin-left:4px;font-size:11.5px}
@media (max-width:560px){.clog .ver{grid-template-columns:minmax(0,1fr);gap:6px}.clog .line{margin-left:4px}}
.sitefoot .links a:hover{color:var(--ink)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(420px,100%);display:grid;gap:12px}
.modal h2{margin:0;font-family:var(--f-disp);font-size:20px}
.modal p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.7}
.modal input{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px;font-size:14px;width:100%}
.btn.wide{width:100%;justify-content:center;height:40px;font-size:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{font-size:13px;color:var(--chord)}
.report pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;white-space:pre-wrap;font-family:var(--f-body);font-size:14px;line-height:1.8;margin:8px 0 12px}
body.perform main{margin-left:0;max-width:none;padding-left:max(24px,env(safe-area-inset-left,0px))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- song page ---------- */
function chordsOf(song){const out=[];const add=c=>{if(c&&/^[A-G]/.test(c)&&!out.includes(c))out.push(c)};
  if(song.sections)song.sections.forEach(s=>s.rows.forEach(r=>(r.b||r).forEach(b=>b.forEach(add))));
  else parsePro(song.body).forEach(s=>s.lines.forEach(l=>l.forEach(g=>add(g.c))));return out}
function capoScore(song,shift,capo){const shape=tKey(tKey(song.key,shift),-capo),flat=keyFlat(shape);let sc=0;
  chordsOf(song).forEach(c=>{const x=tChord(c,shift-capo,flat).split('/')[0];sc+=OPEN.has(x)?2:['F','Bm','F#m','Bb'].includes(x)?.6:0});return sc-capo*.15}
function bestCapo(song,shift){let best=0,bs=-1e9;for(let c=0;c<=7;c++){const v=capoScore(song,shift,c);if(v>bs+1e-9){bs=v;best=c}}return best}

    <div class="tg"><span class="tl">${t('transpose')}</span><div class="tc"><button class="tb" data-act="key-" aria-label="−1">−</button><span class="tv" id="keyv"></span><button class="tb" data-act="key+" aria-label="+1">+</button><button class="tb" data-act="key0" title="${t('resetTip')}">${t('reset')}</button></div></div>

function barsHtml(r,C){const beats0=beatsOf(st.song&&st.song.time);
  return `<div class="rowline"><div class="bars">${r.b.map(bar0=>{let bar=bar0,m='';if(bar.length>1&&METER.test(bar[0])){m=bar[0];bar=bar.slice(1)}
    const beats=m?beatsOf(m):beats0,ts=m?`<svg class="tsig" viewBox="0 0 12 22" role="img" aria-label="${esc(m)}"><title>${esc(m)}</title><text x="6" y="10" text-anchor="middle">${m.split('/')[0]}</text><text x="6" y="21" text-anchor="middle">${m.split('/')[1]}</text></svg>`:'';

    const pos=sl.map((c,i)=>c==='-'?-1:i).filter(i=>i>=0),spans=pos.map((p,j)=>(j+1<pos.length?pos[j+1]:sl.length)-p);
    const even=pos[0]===0&&spans.every(x=>x===spans[0]);
    return `<div class="bar${m?' hasts':''}" style="grid-template-columns:repeat(${sl.length},minmax(0,1fr))">${ts}${sl.map(c=>c==='-'?`<span class="bt${even?' hid':''}" aria-hidden="true">·</span>`:C(c)).join('')}</div>`}).join('')}</div><span class="rep">${r.x?`×${r.x}`:''}</span></div>`}

function parsePro(txt){const secs=[];let cur={name:'',lines:[]};const push=()=>{if(cur.lines.length||cur.name)secs.push(cur)};
  String(txt||'').split(/\r?\n/).forEach(raw=>{const line=raw.replace(/\s+$/,'');
    const d=line.match(/^\{(?:c|comment)\s*:\s*(.*)\}$/i)||line.match(/^#\s*(.+)$/);
    if(d){push();cur={name:d[1].trim(),lines:[]};return}
    if(/^\{\w+\s*:.*\}$/.test(line))return;
    if(!line.trim()){if(cur.lines.length){push();cur={name:'',lines:[]}}return}
    const segs=[];const re=/\[([^\]]+)\]/g;let last=0,m,pend=null;
    while((m=re.exec(line))){const x=line.slice(last,m.index);if(pend!==null||x)segs.push({c:pend,l:x});pend=m[1];last=re.lastIndex}
    segs.push({c:pend,l:line.slice(last)});cur.lines.push(segs)});
  push();return secs}

function blip(tm,freq,vol){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(vol,tm);g.gain.exponentialRampToValueAtTime(.001,tm+.045);o.connect(g).connect(actx.destination);o.start(tm);o.stop(tm+.05)}
function click(){const tm=actx.currentTime+.01,dur=60/st.bpm;blip(tm,beat%4===0?1600:1000,.35);

async function viewStats(){
  const box=$('#app');box.innerHTML=`<article class="prose"><h1>${t('stAdminTitle')}</h1><p>…</p></article>`;
  if(!sb||!isAdmin()){box.innerHTML=`<article class="prose"><h1>${t('stAdminTitle')}</h1><p>${t('stNoAccess')}</p></article>`;return}
  const {data:D,error}=await sb.rpc('stat_admin',{p_days:statsDays});
  if(location.hash!=='#stats')return;
  if(error||!D){box.innerHTML=`<article class="prose"><h1>${t('stAdminTitle')}</h1><p>${t('stErr')}</p></article>`;return}
  const norm=x=>String(x||'').toLowerCase();
  const onSite=k=>SONGS.some(s=>norm(s.title).includes(k)||norm(s.artist).includes(k)||k.includes(norm(s.title)));
  const sum=f=>(D.daily||[]).reduce((a,x)=>a+(x[f]||0),0);
  const days=[];{const today=new Date(Date.now()+8*3600e3);for(let k=statsDays-1;k>=0;k--){const d=new Date(today-k*864e5).toISOString().slice(0,10);const r=(D.daily||[]).find(x=>x.day===d);days.push({d,v:r?r.views||0:0})}}
  const dmax=Math.max(1,...days.map(x=>x.v));
  box.innerHTML=`<article class="prose" style="max-width:920px"><div class="sthead"><h1>${t('stSite')}</h1><span>${t('stOnlyYou')}</span>
  <div class="statnav">${[[7,'stD7'],[30,'stD30'],[90,'stD90'],[365,'stD365']].map(([n,k])=>`<button class="${n===statsDays?'on':''}" data-days="${n}">${t(k)}</button>`).join('')}</div></div>
  <dl class="kpis"><div><dt>${t('stV')}</dt><dd>${sum('views').toLocaleString()}</dd></div><div><dt>${t('stU')}</dt><dd>${sum('visitors').toLocaleString()}</dd></div><div><dt>${t('stMembers')}</dt><dd>${Number(D.members||0).toLocaleString()}</dd></div></dl>
  <h2 class="sth">${t('stDaily')}</h2><div class="dcols" role="img" aria-label="${t('stDaily')}">${days.map(x=>`<span title="${x.d}：${x.v}" style="height:${x.v?Math.max(3,Math.round(x.v/dmax*100)):0}%"></span>`).join('')}</div>
  <div class="daxis"><span>${days[0].d.slice(5)}</span><span>${days[days.length-1].d.slice(5)}</span></div>
  <div class="st2"><div><h2 class="sth">${t('stKw')}</h2><table class="stattbl"><thead><tr><th>${t('stKw')}</th><th>${t('stOnSite')}</th><th style="text-align:right">${t('stCount')}</th></tr></thead><tbody>${(D.searches||[]).map(x=>{const ok=onSite(x.key);return `<tr><td>${esc(x.key)}</td><td>${ok?`<span class="tag-has">${t('stHas')}</span>`:`<span class="tag-miss">${t('stMiss')}</span>`}</td><td class="n">${x.n}</td></tr>`}).join('')||`<tr><td colspan="3">${t('stNone')}</td></tr>`}</tbody></table></div>
  <div><h2 class="sth">${t('stHot')}</h2><table class="stattbl"><thead><tr><th>${t('stSongCol')}</th><th style="text-align:right">${t('stCount')}</th></tr></thead><tbody>${(D.songs||[]).map(x=>{const s=SONGS.find(y=>y.id===x.key);return `<tr><td>${s?`<a href="/song/${s.id}/" style="text-decoration:underline">${esc(s.title)}</a> <small style="color:var(--muted)">${esc(s.artist)}</small>`:esc(x.key)}</td><td class="n">${x.n}</td></tr>`}).join('')||`<tr><td colspan="2">${t('stNone')}</td></tr>`}</tbody></table></div></div></article>`;
  box.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{statsDays=Number(b.dataset.days);viewStats()});
}

/* ---------- account & sync (Supabase) ---------- */
// 填入 Supabase 專案的 Project URL 和 Publishable（anon）key 後就會啟用會員同步；留空則不顯示登入。
const SUPABASE_URL='https://lgavlxdgysrficiqbwyo.supabase.co';
const SUPABASE_KEY='sb_publishable_UsEHwWKSO_nnE4LHRh2R9Q_NlsBwgtk';
let sb=null,user=null,syncState='ok',pending=false,merged=false,pushT;
const isSyncKey=k=>k==='fav'||k==='recent'||k==='mine'||k.startsWith('pref_')||k.startsWith('lyr_');
const rawSet=LS.set.bind(LS);
LS.set=(k,v)=>{rawSet(k,v);if(user&&isSyncKey(k))schedulePush()};
function syncLabel(){return syncState==='syncing'?' · '+t('syncing'):syncState==='err'?' · !':''}
function setSync(s){syncState=s;const d=$('#syncdot');if(d)d.textContent=syncLabel();const m=$('#acctsync');if(m)m.textContent=s==='syncing'?t('syncing'):s==='err'?t('syncErr'):t('synced')}
function collectLocal(){const d={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('gp_')&&isSyncKey(k.slice(3)))d[k.slice(3)]=JSON.parse(localStorage.getItem(k))}}catch(e){}return d}
function mergeData(local,remote){const out={...local,...remote};
  out.fav=[...new Set([...(remote.fav||[]),...(local.fav||[])])];
  out.recent=[...new Set([...(remote.recent||[]),...(local.recent||[])])].slice(0,20);
  const m=new Map();[...(local.mine||[]),...(remote.mine||[])].forEach(x=>x&&m.set(x.id,x));out.mine=[...m.values()];
  const hasLyr=x=>Array.isArray(x)?x.some(l=>l&&l.trim()):!!(x&&x.L&&Object.values(x.L).some(o=>Object.values(o||{}).some(a=>Array.isArray(a)&&a.some(l=>l&&l.trim()))));
  Object.keys(local).forEach(k=>{if(k.startsWith('lyr_')&&!hasLyr(remote[k]))out[k]=local[k]});
  return out}
function schedulePush(){pending=true;setSync('syncing');clearTimeout(pushT);pushT=setTimeout(push,1200)}
async function push(){if(!user)return;pending=false;
  const {error}=await sb.from('user_data').upsert({user_id:user.id,data:collectLocal(),updated_at:new Date().toISOString()});
  if(error){setSync('err');pending=true;pushT=setTimeout(push,15000)}else setSync('ok')}
async function pull(merge){
  const {data,error}=await sb.from('user_data').select('data').eq('user_id',user.id).maybeSingle();
  if(error){setSync('err');return false}
  const remote=(data&&data.data)||{},local=collectLocal(),next=merge?mergeData(local,remote):remote;
  const changed=JSON.stringify(next)!==JSON.stringify(local);
  if(!merge)Object.keys(local).forEach(k=>{if(!(k in next))try{localStorage.removeItem('gp_'+k)}catch(e){}});
  Object.entries(next).forEach(([k,v])=>rawSet(k,v));
  if(merge)await push();else setSync('ok');
  return changed}
const refresh=()=>{if(SONGS.length&&!(document.activeElement&&document.activeElement.matches('textarea,input')))route(true)};
function initSync(){
  if(!SUPABASE_URL||!SUPABASE_KEY||!window.supabase)return;
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange((ev,session)=>{const u=session?session.user:null;const changedUser=(u&&u.id)!==(user&&user.id);user=u;
    if(user&&!merged){merged=true;setTimeout(()=>pull(true).then(()=>{renderRail();refresh()}),0)}
    if(!user)merged=false;
    if(changedUser){renderRail();if($('#modal').dataset.kind==='acct')openAccount();if(location.hash==='#stats'&&SONGS.length)viewStats()}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&user&&!pending)pull(false).then(ch=>{if(ch)refresh()})});
  renderRail();
}
function closeModal(){$('#modal').hidden=true;$('#modal').dataset.kind=''}
function openAccount(){
  const m=$('#modal');m.dataset.kind='acct';m.hidden=false;
  if(user){
    m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${t('account')}</h2><p>${t('signedIn')}：${esc(user.email||'')}</p><p class="msg" id="acctsync">${syncState==='err'?t('syncErr'):syncState==='syncing'?t('syncing'):t('synced')}</p>
      <button class="btn wide" id="logout">${t('logout')}</button><button class="btn wide" id="mclose">${t('close')}</button></div>`;
    $('#logout').onclick=async()=>{await sb.auth.signOut();closeModal();renderRail();refresh()};
  }else{
    m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${t('loginTitle')}</h2><p>${t('loginWhy')}</p>
      <button class="btn pri wide" id="google">${t('google')}</button><div class="or">${t('or')}</div>
      <input type="email" id="lemail" placeholder="${t('emailPh')}" autocomplete="email"><button class="btn wide" id="lsend">${t('sendLink')}</button>
      <p class="msg" id="lmsg" aria-live="polite"></p><button class="btn wide" id="mclose">${t('close')}</button></div>`;
    const back=location.origin+location.pathname;
    $('#google').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:back}});
    $('#lsend').onclick=async()=>{const e=$('#lemail').value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){$('#lmsg').textContent=t('badEmail');return}
      const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:back}});$('#lmsg').textContent=error?error.message:t('sent')};
  }
  $('#mclose').onclick=closeModal;
}

/* ---------- router ---------- */
function route(keep){
  let h=location.hash.slice(1);
  if(h.startsWith('song-')){location.replace('/song/'+h.slice(5)+'/');return}
  if(!h&&window.PAGE_SONG)h='song-'+window.PAGE_SONG;
  h=h||'home';
  if(h!=='report')try{sessionStorage.setItem(lastPageKey,location.href)}catch(e){}
  h={favorites:'library-saved',mine:'library-mine',recent:'library-recent'}[h]||h;
  let nav='home';
  if(h.startsWith('song-')){const s=SONGS.find(x=>x.id===h.slice(5));s?openSong(s,false,keep===true):viewHome()}
  else if(h.startsWith('my-')){const s=mine().find(x=>x.id===h.slice(3));s?openSong(s,true,keep===true):viewLibrary('library-mine');nav='library'}
  else{stopAll();
    if(h.startsWith('edit-')){viewEdit(h.slice(5));nav='library'}
    else if(h==='new'){viewEdit('');nav='library'}
    else if(h.startsWith('library')){viewLibrary(['library','library-saved','library-mine','library-recent'].includes(h)?h:'library');nav='library'}
    else if(h==='studio'){viewStudio();nav='studio'}
    else if(h==='legal'){viewLegal();nav='legal'}
    else if(h==='changelog'){viewChangelog();nav='changelog'}
    else if(h==='stats'){viewStats();nav='stats'}
    else if(h==='report'){viewReport();nav='report'}
    else viewHome()}
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
  if(keep!==true)window.scrollTo(0,0);$('#tip').hidden=true;
}
document.documentElement.lang=lang==='zh'?'zh-Hant':'en';

if(!window.PAGE_SONG)$('#app').innerHTML='<p style="color:var(--muted)">…</p>';
fetch('/songs.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{SONGS=d;route()}).catch(()=>{$('#app').innerHTML='<div class="empty"><b>'+(lang==='zh'?'樂譜載入失敗':'Could not load sheets')+'</b>'+(lang==='zh'?'請重新整理頁面。':'Please reload the page.')+'</div>'});
